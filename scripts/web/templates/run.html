<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DART</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="run">
  <header class="topbar">
    <div class="brand-sm"><span class="reticle-sm"></span> DART</div>
    <div class="mode-pill dart">SECURITY TURRET</div>
    <form method="post" action="{{ url_for('stop') }}" id="stopForm">
      <button class="stop" type="submit">■ STOP</button>
    </form>
  </header>

  <main class="stage">
    <div class="feed">
      <img id="video" src="{{ url_for('video_feed') }}" alt="DART live feed">
      <div id="banner" class="banner hidden"></div>
    </div>

    <aside class="panel">
      <div class="row"><span class="k">Status</span><span class="v" id="status">—</span></div>
      <div class="row"><span class="k">Serial</span><span class="v" id="serial">—</span></div>
      <div class="row"><span class="k">FPS</span><span class="v" id="fps">—</span></div>

      <div class="auth-block">
        <h3 class="auth-title">Authorize Person</h3>
        <input id="authName" class="auth-input" type="text" placeholder="name"
               autocomplete="off" spellcheck="false">
        <button id="authCapture" class="auth-btn" type="button">◉ Capture from feed</button>
        <label class="auth-upload" for="authFiles">or upload photos…</label>
        <input id="authFiles" type="file" accept="image/jpeg,image/png" multiple hidden>
        <div class="auth-msg" id="authMsg"></div>
        <div class="auth-list" id="authList"></div>
      </div>
    </aside>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
