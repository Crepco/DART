<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DART — launch</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="landing">
  <main class="wrap">
    <header class="brand">
      <div class="reticle" aria-hidden="true"></div>
      <h1>DART</h1>
      <p class="tag">Auto-aim security turret</p>
    </header>

    <div class="camera-pick">
      <label for="cameraSelect">Camera</label>
      <select id="cameraSelect"><option value="">default</option></select>
      <button type="button" id="refreshCams" title="Re-scan cameras">⟳ scan</button>
    </div>

    <div class="camera-pick">
      <label for="portSelect">Arduino</label>
      <select id="portSelect"><option value="">default</option></select>
      <button type="button" id="refreshPorts" title="Re-scan serial ports">⟳ scan</button>
    </div>

    <section class="cards cards-single">
      <form class="card dart" method="post" action="{{ url_for('start') }}">
        <input type="hidden" name="camera" class="cameraField">
        <input type="hidden" name="port" class="portField">
        <h2>DART</h2>
        <p>The security turret. Face authorization gates the trigger —
           it tracks everyone but <strong>only fires at UNAUTHORIZED targets</strong>.</p>
        <ul class="meta">
          <li>Targets: UNAUTHORIZED persons</li>
          <li>Fires: on a dwelled lock-on</li>
        </ul>
        <button type="submit">Launch DART →</button>
      </form>
    </section>

    <footer class="foot">
      <span class="dot"></span> Arduino Uno R3 · servos pan&nbsp;10 / tilt&nbsp;9 / trigger&nbsp;8
    </footer>
  </main>
  <script src="{{ url_for('static', filename='landing.js') }}"></script>
</body>
</html>
